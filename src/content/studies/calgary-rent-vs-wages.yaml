number: 1
title: Has Calgary rent outpaced wages since 2020?
topic: Housing
published: 2026-11-23
readMinutes: 6
placeholder: true
answer: >-
  [Sample answer] Yes. Typical rent rose about 38% while typical wages rose about 17%, so rent now
  takes a bigger bite of every paycheque.
shareText: "Has Calgary rent outpaced wages since 2020? Every source, the method and what it can't show:"

tiles:
  - { kind: headline, label: The gap, value: +21 pts, note: 'rent growth minus wage growth, 2020–2025' }
  - { label: Rent growth, value: +38%, note: 'median 2-bed, 2020 → 2025' }
  - { label: Wage growth, value: +17%, note: median weekly earnings }
  - { kind: text, label: Hardest-hit area, value: NW, note: +26 pt gap }

chart:
  caption: Rent and wages, indexed to 2020 = 100
  years: ['2020', '2021', '2022', '2023', '2024', '2025']
  aLabel: Median rent
  aShort: Rent
  bLabel: Median wage
  bShort: Wage
  unit: index, 2020 = 100
  annotation:
    index: 3
    title: 2023
    text: Biggest single-year jump in rent.
  views:
    - type: line
      id: nominal
      label: Nominal
      a: [100, 103, 110, 121, 131, 138]
      b: [100, 102, 105, 109, 113, 117]
      yMin: 90
      yMax: 140
      yTicks: [100, 110, 125, 140]
      notes:
        - Index starts at 100 in 2020.
        - Rent and wages still move together.
        - Rent pulls away as vacancies fall.
        - Biggest single-year jump in rent.
        - Gap keeps widening.
        - Gap reaches its widest point so far.
    - type: line
      id: real
      label: Inflation-adjusted
      short: Inflation-adj.
      a: [100, 100, 100, 106, 112, 115]
      b: [100, 99, 95, 96, 97, 98]
      yMin: 90
      yMax: 140
      yTicks: [100, 110, 125, 140]
      notes:
        - Index starts at 100 in 2020.
        - After inflation, wages slip while rent holds.
        - After inflation, wages fell while rent held flat.
        - Rent starts rising faster than prices.
        - After inflation, wages fell while rent rose.
        - After inflation, rent is up 15% and wages are down 2%.
    - type: bars
      id: area
      label: By quadrant
      short: By area
      unit: ' pts'
      caption: Gap between rent and wage growth, 2020–2025, by quadrant.
      bars:
        - { label: NW, value: 26 }
        - { label: NE, value: 22 }
        - { label: SW, value: 18 }
        - { label: SE, value: 14 }
  source: CMHC Rental Market Survey; Statistics Canada, Table 14-10-0223-01
  sourceShort: CMHC; StatCan 14-10-0223-01

findings:
  - Rent grew 38%, wages 17%. The gap opened in 2022, not 2020.
  - After inflation, rent is up 15% and wages are down 2%.
  - The NW saw the widest gap, at 26 points.
caveat: >-
  These are asking rents for vacant units. People who stayed in the same place usually pay less,
  so the squeeze is sharpest for movers.

