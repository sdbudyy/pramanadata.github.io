number: 2
title: Do oil prices still drive Calgary jobs?
topic: Economy
published: 2026-11-23
readMinutes: 5
placeholder: true
answer: >-
  [Sample answer] Less than they used to. Since 2015 Calgary jobs have moved with oil prices only
  loosely, and the link is weakest outside the energy sector.

tiles:
  - { kind: headline, label: Correlation, value: r = 0.41, note: 'yearly jobs vs oil price, 2015–2025' }
  - { label: Jobs, value: +14%, note: 'Calgary employment, 2015 → 2025' }
  - { label: Oil price, value: +35%, note: 'WTI annual average, 2015 → 2025' }
  - { kind: text, label: Most tied sector, value: Mining and oil, note: r = 0.78 }

chart:
  caption: Calgary jobs and the oil price, indexed to 2015 = 100
  years: ['2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023', '2024', '2025']
  aLabel: Calgary employment
  aShort: Jobs
  bLabel: Oil price (WTI)
  bShort: Oil
  unit: index, 2015 = 100
  annotation:
    index: 5
    title: 2020
    text: Both fall in the pandemic, then split apart.
  views:
    - type: line
      id: indexed
      label: Indexed
      a: [100, 98, 99, 101, 102, 95, 99, 104, 108, 112, 114]
      b: [100, 88, 104, 133, 116, 80, 139, 194, 159, 155, 135]
      yMin: 0
      yMax: 200
      yTicks: [0, 50, 100, 150, 200]
    - type: bars
      id: sector
      label: By sector
      unit: ''
      caption: Correlation between yearly jobs and oil price, 2015–2025, by sector (r).
      bars:
        - { label: Mining and oil, value: 0.78 }
        - { label: Construction, value: 0.52 }
        - { label: Professional services, value: 0.31 }
        - { label: Health care, value: 0.05 }
  source: Statistics Canada, Labour Force Survey; US EIA, WTI spot price
  sourceShort: StatCan LFS; US EIA

findings:
  - Jobs and oil moved together until 2020, then split apart.
  - Mining and oil jobs still track the price closely (r = 0.78).
  - Health care jobs show almost no link to oil at all.
caveat: >-
  A correlation is not a cause. Interest rates, migration and the pandemic all moved Calgary jobs
  at the same time as oil, and this study does not separate them.

