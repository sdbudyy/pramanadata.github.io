steps:
  - Pulled yearly employment for the Calgary metro area
  - Averaged daily WTI prices to yearly values
  - Indexed both series to 2015 = 100
  - Calculated the correlation overall and by sector
assumptions:
  - Yearly averages hide month-to-month swings
  - WTI stands in for the price Alberta producers get
  - Correlation over 11 years is a small sample

